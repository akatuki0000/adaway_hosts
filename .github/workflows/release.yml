name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version info
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VC=$(grep -oP 'versionCode=\K[0-9]+' module.prop)
          V=$(grep -oP '^version=\K.*' module.prop)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / module.prop version=$V versionCode=$VC"

      - name: Build module zip
        run: |
          zip -X -r adaway_hosts.zip \
            module.prop post-fs-data.sh service.sh uninstall.sh action.sh \
            skip_mount system
          unzip -l adaway_hosts.zip

      - name: Generate update.json
        run: |
          cat > update.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/adaway_hosts.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          }
          EOF
          cat update.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: adaway_hosts.zip
          generate_release_notes: true

      - name: Commit update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git commit -m "Update update.json for ${{ steps.ver.outputs.tag }}"; then
            git push origin HEAD:main
          fi
